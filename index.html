<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Wilgenhaven Bootverhuur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: één smalle app-kolom (telefoon eerst), sticky kop met stappen, vaste actiebalk onderaan */
:root{
  --bg:#EAF4F6; --surface:#FFFFFF; --water:#D3ECEF; --ink:#0F2328; --muted:#4F666C; --line:#C9DDE1;
  --accent:#00788A; --accent-ink:#FFFFFF; --brass:#A9741A; --glass:#8FCFD8;
  --ok:#2C7A4B; --ok-bg:#E1F1E7; --warn:#9A5400; --warn-bg:#FBEBD6; --err:#B3261E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A171B; --surface:#112329; --water:#0D3640; --ink:#E2EEF1; --muted:#93AAB0; --line:#243B42;
  --accent:#3FC6D6; --accent-ink:#04232A; --brass:#DDB05A; --glass:#2F6E79;
  --ok:#73C995; --ok-bg:#163526; --warn:#F2AA5C; --warn-bg:#3A2710; --err:#FF8A80; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A171B; --surface:#112329; --water:#0D3640; --ink:#E2EEF1; --muted:#93AAB0; --line:#243B42;
  --accent:#3FC6D6; --accent-ink:#04232A; --brass:#DDB05A; --glass:#2F6E79;
  --ok:#73C995; --ok-bg:#163526; --warn:#F2AA5C; --warn-bg:#3A2710; --err:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 132px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;position:relative}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
/* leesbaarheid: half-doorzichtig, vervaagd paneel achter de app-kolom, zodat tekst nooit direct op de tekening staat */
.wrap::before{content:"";position:absolute;inset:0 -16px -24px;z-index:-1;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (min-width:600px){.wrap::before{inset:0 -28px -28px;border-radius:0 0 28px 28px}}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* kop */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-height:40px}
.brand .mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps span{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px}
.steps span::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.steps span.on{color:var(--ink);font-weight:700}
.steps span.on::before,.steps span.done::before{background:var(--accent)}
.proto{font-size:.8rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.modes button{border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:700;cursor:pointer;color:var(--muted)}
.modes button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.dims{grid-template-columns:1fr}}

main{display:grid;gap:20px;padding-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
label.lbl,.lbl{font-weight:700;font-size:.92rem;display:block}
.field{display:grid;gap:6px}
input[type=date],input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:80px;resize:vertical}
.err{color:var(--err);font-size:.85rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;cursor:pointer;font-weight:700;font-size:.92rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper output{font-family:var(--mono);font-size:1.5rem;min-width:2ch;text-align:center}
/* minmax(0,…) en min-width:0 laten velden (zoals datumvelden) meekrimpen, zodat niets breder wordt dan het scherm */
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row2>*,.card>*{min-width:0}
input,select{min-width:0}
@media (max-width:380px){.row2{grid-template-columns:1fr}}

.facts{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.facts li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.95rem}
.facts svg{width:24px;height:24px;color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.92rem}
.summary .link{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

.boats{display:grid;gap:14px}
.boat{all:unset;box-sizing:border-box;display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.boat:hover{border-color:var(--accent)}
.boat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.boat[aria-disabled=true]{cursor:default;opacity:.55}
.boat[aria-disabled=true]:hover{border-color:var(--line)}
.pic{display:block;background:var(--water);aspect-ratio:320/130;max-width:100%}
.pic svg{display:block;width:100%;height:100%}
.boat .body{display:grid;gap:8px;padding:14px 16px 16px}
.boat .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.boat .name{font-family:var(--display);font-weight:800;font-size:1.3rem}
.boat .price{font-family:var(--mono);font-size:1.15rem;white-space:nowrap}
.boat .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.9rem;color:var(--muted)}
.note{font-size:.9rem;color:var(--muted)}

.specs{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}
.specs div{display:grid;gap:2px}
.specs dt{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:0;font-weight:700}
.incl{margin:0;padding-left:1.2em;display:grid;gap:4px}
.extra{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.extra input{width:22px;height:22px;accent-color:var(--accent)}
.extra small{display:block;color:var(--muted)}
.extras{display:grid;gap:8px}

.lines{display:grid;gap:6px;margin:0}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.lines dt{min-width:0}
.lines .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700}
.lines .total dd{font-size:1.15rem}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;cursor:pointer;font-size:.95rem}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent)}

.done{text-align:left;display:grid;gap:12px}
.tick{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.code{font-family:var(--mono);font-size:1.6rem;letter-spacing:.04em}

/* actiebalk */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:14px;align-items:center}
.bar .tot{display:grid;line-height:1.2}
.bar .tot small{color:var(--muted);font-size:.78rem}
.bar .tot b{font-family:var(--mono);font-size:1.15rem}
.btn{flex:1;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;padding:14px 18px;cursor:pointer;min-height:52px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Achtergrond: haven met zeilboot en sloep, getekend met de themakleuren -->
<svg class="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
  <circle cx="1090" cy="150" r="60" fill="var(--brass)" opacity=".18"/>
  <g fill="var(--surface)" opacity=".7">
    <ellipse cx="220" cy="150" rx="90" ry="22"/><ellipse cx="280" cy="135" rx="60" ry="20"/>
    <ellipse cx="760" cy="110" rx="70" ry="16"/>
  </g>
  <path d="M0 520 Q 300 500 600 515 T 1200 510 V800 H0Z" fill="var(--water)"/>
  <path d="M0 610 Q 150 590 300 610 T 600 610 T 900 610 T 1200 610 V800 H0Z" fill="var(--glass)" opacity=".45"/>
  <path d="M0 700 Q 150 680 300 700 T 600 700 T 900 700 T 1200 700 V800 H0Z" fill="var(--glass)" opacity=".7"/>
  <!-- steiger -->
  <g fill="var(--brass)" opacity=".55">
    <rect x="40" y="500" width="300" height="12" rx="3"/>
    <rect x="70" y="512" width="10" height="70"/><rect x="190" y="512" width="10" height="70"/><rect x="310" y="512" width="10" height="70"/>
  </g>
  <!-- zeilboot -->
  <g transform="translate(925 330) scale(.85)">
    <rect x="128" y="0" width="7" height="250" rx="2" fill="var(--ink)" opacity=".75"/>
    <path d="M124 14 L124 236 L10 236 Z" fill="var(--surface)" stroke="var(--line)" stroke-width="3"/>
    <path d="M140 40 L140 236 L236 236 Z" fill="var(--surface)" opacity=".85" stroke="var(--line)" stroke-width="3"/>
    <path d="M-20 250 H290 L250 300 H20 Z" fill="var(--accent)"/>
    <path d="M-20 250 H290 L284 258 H-13 Z" fill="var(--brass)" opacity=".8"/>
    <path d="M10 318 Q 60 308 130 318 T 260 318" fill="none" stroke="var(--surface)" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- sloep -->
  <g transform="translate(120 590)">
    <path d="M0 0 H170 L150 34 H18 Z" fill="var(--surface)" stroke="var(--accent)" stroke-width="4"/>
    <rect x="60" y="-26" width="60" height="26" rx="5" fill="var(--accent)" opacity=".85"/>
    <path d="M10 46 Q 50 38 90 46 T 170 46" fill="none" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="var(--accent)"/><path d="M6 20q2.75-3 5.5 0t5.5 0 5.5 0 5.5 0" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/><path d="M11 15h12l-2 3h-8z" fill="var(--brass)"/></svg>
      <div><b>Wilgenhaven</b><small>Bootverhuur</small></div>
      <button class="back" id="back" data-act="back" hidden>← Terug</button>
    </div>
    <div class="steps" id="steps" aria-label="Voortgang"></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div class="bar"><div class="in" id="bar"></div></div>

<script>
const BOATS = [
  {id:'reiger', name:'Reiger', type:'Elektrische sloep', shape:'sloep', cap:8, rate:45, license:false, speed:'9 km/u', motor:'Elektrisch, fluisterstil',
   desc:'Onze populairste sloep. Banken rondom, een tafel in het midden en genoeg plek voor een uitgebreide lunch aan boord.',
   incl:['Tafel en kussens','Bluetooth-speaker','Zwemvesten voor iedereen']},
  {id:'meerkoet', name:'Meerkoet', type:'Elektrische sloep met kap', shape:'kap', cap:10, rate:55, license:false, speed:'9 km/u', motor:'Elektrisch, fluisterstil',
   desc:'Ruime sloep met een linnen kap. Gaat het miezeren, dan vaar je gewoon droog verder.',
   incl:['Uitklapbare kap','Tafel en kussens','Bluetooth-speaker','Zwemvesten voor iedereen']},
  {id:'fuut', name:'Fuut', type:'Tendersloep', shape:'tender', cap:12, rate:69, license:false, speed:'18 km/u', motor:'Elektrisch, 10 kW',
   desc:'Onze grootste boot, geschikt voor een familiedag of uitje met collega’s. Blijft net onder de 20 km/u, dus geen vaarbewijs nodig.',
   incl:['Zonnebed op het voordek','Tafel en kussens','Koelvak','Zwemvesten voor iedereen']},
  {id:'ijsvogel', name:'IJsvogel', type:'Fluisterboot', shape:'fluister', cap:4, rate:29, license:false, speed:'6 km/u', motor:'Elektrisch, fluisterstil',
   desc:'Klein en wendbaar. Ideaal om met z’n tweeën of vieren de smalle slootjes in te varen.',
   incl:['Zonnekap','Kussens','Zwemvesten voor iedereen']},
  {id:'aalscholver', name:'Aalscholver', type:'Speedboot', shape:'speed', cap:6, rate:95, license:true, speed:'45 km/u', motor:'Buitenboordmotor 60 pk',
   desc:'Voor wie wat meer snelheid zoekt op het open water. Sneller dan 20 km/u, dus een Klein Vaarbewijs is verplicht.',
   incl:['Volle tank bij vertrek','Zwemvesten voor iedereen','Korte vaaruitleg']},
];
const EXTRAS = [
  {id:'picknick', name:'Picknickmand voor 4', sub:'Brood, kaas, fruit en drinken', price:39.5},
  {id:'koelbox', name:'Koelbox met ijs', sub:'Neem je eigen drankjes mee', price:7.5},
  {id:'dekens', name:'Fleecedekens', sub:'Handig in het najaar', price:0},
  {id:'schipper', name:'Schipper aan boord', sub:'€ 35 per uur, jij hoeft niet te sturen', perHour:35},
];
const DURATIONS = [{h:2,label:'2 uur'},{h:3,label:'3 uur'},{h:4,label:'4 uur'},{h:8,label:'Hele dag'}];
const DEPOSIT = 100;
const STEP_LABELS = ['Zoeken','Boot','Extra’s','Gegevens'];

const eur = n => new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const niceDate = s => new Date(s+'T12:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
const shortDate = s => new Date(s+'T12:00').toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
const hh = h => String(h).padStart(2,'0')+':00';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const today = new Date();
const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);

const S = {mode:'huur', step:0, date:iso(tomorrow), hours:3, start:13, people:6, boatId:null, extras:new Set(['dekens']),
  name:'', email:'', phone:'', license:'', remark:'', agree:false, errors:{}, code:''};

// Voorbeeldbezetting: per boot per dag één vaste geboekte periode, afgeleid van datum en boot
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function busy(b,date){const h=hash(b.id+date); if(h%3===0) return null; const s=10+(h>>>3)%6; return [s,Math.min(18,s+2+(h>>>7)%3)];}
function isFree(b){const x=busy(b,S.date); if(!x) return true; const end=S.start+S.hours; return end<=x[0]||S.start>=x[1];}
const boat = () => BOATS.find(b=>b.id===S.boatId);
const base = b => S.hours===8 ? b.rate*6 : b.rate*S.hours;
const startOptions = () => { const out=[]; for(let h=10; h<=18-S.hours; h++) out.push(h); return out; };
const endTime = () => S.start + S.hours;
function lines(b){
  const rows=[[`${b.name}, ${S.hours===8?'hele dag (dagprijs)':S.hours+' uur'}`, base(b)]];
  for(const e of EXTRAS) if(S.extras.has(e.id)) rows.push([e.name + (e.perHour?` (${S.hours} uur)`:''), e.perHour? e.perHour*S.hours : e.price]);
  return rows;
}
const total = b => lines(b).reduce((a,r)=>a+r[1],0);

function boatSvg(shape){
  const waves = `<path d="M0 110q20-7 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0" fill="none" stroke="var(--accent)" stroke-opacity=".35" stroke-width="3"/><path d="M-20 122q20-6 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0" fill="none" stroke="var(--accent)" stroke-opacity=".2" stroke-width="3"/>`;
  const s = {
    sloep:`<rect x="70" y="58" width="44" height="14" rx="4" fill="var(--brass)"/><rect x="196" y="58" width="56" height="14" rx="4" fill="var(--brass)"/><rect x="140" y="50" width="30" height="22" rx="3" fill="var(--glass)"/><path d="M28 72H292Q288 102 250 106H70Q36 104 28 72Z" fill="var(--accent)"/><path d="M28 72H292" stroke="var(--brass)" stroke-width="4" stroke-linecap="round"/>`,
    kap:`<path d="M84 36Q160 18 236 36V42H84Z" fill="var(--muted)"/><path d="M90 42V72M230 42V72" stroke="var(--muted)" stroke-width="3"/><rect x="70" y="58" width="44" height="14" rx="4" fill="var(--brass)"/><rect x="196" y="58" width="56" height="14" rx="4" fill="var(--brass)"/><path d="M28 72H292Q288 102 250 106H70Q36 104 28 72Z" fill="var(--accent)"/><path d="M28 72H292" stroke="var(--brass)" stroke-width="4" stroke-linecap="round"/>`,
    tender:`<rect x="40" y="62" width="70" height="10" rx="4" fill="var(--brass)"/><path d="M168 72L180 46H204L200 72Z" fill="var(--glass)"/><rect x="214" y="58" width="60" height="14" rx="4" fill="var(--brass)"/><path d="M16 72H304L296 84Q272 106 232 108H62Q26 104 16 72Z" fill="var(--accent)"/><path d="M16 72H304" stroke="var(--brass)" stroke-width="4" stroke-linecap="round"/>`,
    fluister:`<path d="M104 46Q160 34 216 46V50H104Z" fill="var(--muted)"/><path d="M110 50V78M210 50V78" stroke="var(--muted)" stroke-width="3"/><rect x="122" y="64" width="76" height="14" rx="4" fill="var(--brass)"/><path d="M84 78H236Q232 102 208 104H110Q88 102 84 78Z" fill="var(--accent)"/><path d="M84 78H236" stroke="var(--brass)" stroke-width="4" stroke-linecap="round"/>`,

function render(){

  document.getElementById('back').hidden = !(S.step>0 && !done);

// Passanten: aanmelden voor een ligplaats in de haven
const BERTH = {perMeter:2.10, dayPerMeter:1.00, minLen:8, tax:1.85, power:3.50, dayPower:2.00, maxLen:15, maxBeam:4.5, maxDraft:1.6, maxNights:14};
const dayAfter = new Date(today); dayAfter.setDate(today.getDate()+2);
const P = {arrive:iso(tomorrow), depart:iso(dayAfter), people:2, power:true, vname:'', vtype:'Motorboot', vlength:'', vbeam:'', vdraft:'',
  pname:'', pemail:'', pphone:'', premark:'', agree:false, code:'', berth:''};
const P_FIELDS = ['vname','vlength','vbeam','vdraft','pname','pemail','pphone','premark'];
const num = v => parseFloat(String(v).trim().replace(',','.'));
const nights = () => Math.round((new Date(P.depart+'T12:00') - new Date(P.arrive+'T12:00')) / 864e5);
const plural = (n,one,many) => `${n} ${n===1?one:many}`;

function nightsText(){
  const n = nights();
  if(n<0) return 'Je vertrekdatum ligt voor je aankomstdatum.';
  if(n===0) return 'Dagligplaats: je legt aan en vertrekt op dezelfde dag, uiterlijk om 20:00.';
  return `${plural(n,'nacht','nachten')}, van ${niceDate(P.arrive)} tot ${niceDate(P.depart)}.`;
}
function stayLine(){
  const n = nights();
  return `<span class="mono">${shortDate(P.arrive)}${n>0?' – '+shortDate(P.depart):''}</span> · ${n===0?'dagligplaats':plural(n,'nacht','nachten')} · ${plural(P.people,'persoon','personen')}`;
}
function berthLines(){
  const len = num(P.vlength); if(!(len>0)) return null;
  const m = Math.max(BERTH.minLen, Math.ceil(len)), n = nights(), rows = [];
  if(n===0){
    rows.push([`Dagligplaats, ${m} m × ${eur(BERTH.dayPerMeter)}`, m*BERTH.dayPerMeter]);
    if(P.power) rows.push(['Walstroom, overdag', BERTH.dayPower]);
  } else {
    rows.push([`Havengeld, ${m} m × ${plural(n,'nacht','nachten')} × ${eur(BERTH.perMeter)}`, m*n*BERTH.perMeter]);
    rows.push([`Toeristenbelasting, ${P.people} pers. × ${plural(n,'nacht','nachten')}`, P.people*n*BERTH.tax]);
    if(P.power) rows.push([`Walstroom, ${plural(n,'nacht','nachten')}`, n*BERTH.power]);
  }
  return rows;
}
const berthTotal = () => { const r = berthLines(); return r ? r.reduce((a,x)=>a+x[1],0) : null; };
function berthPrice(){
  const r = berthLines();
  if(!r) return '<p class="note">Vul de lengte van je boot in, dan zie je wat je verblijf kost.</p>';
  return priceTable(r) + `<p class="note">Je betaalt bij aankomst op het havenkantoor of bij de betaalzuil op de steiger.${num(P.vlength)<BERTH.minLen?' Boten korter dan 8 m betalen voor 8 m.':''}</p>`;
}
function updateBerthPrice(){
  const el = document.getElementById('berthprice'); if(el) el.innerHTML = berthPrice();
  const bt = document.getElementById('bartot'); if(bt){ const t = berthTotal(); bt.textContent = t===null ? '—' : eur(t); }
}

    <p class="muted">We hebben een bevestiging gestuurd naar <b>${esc(P.pemail)}</b>. <span class="note">(In dit prototype wordt geen e-mail verstuurd.)</span></p>
  </section>
  <div class="card">
    <div><span class="lbl muted" style="font-weight:400">Aanmeldnummer</span><div class="code">${P.code}</div></div>
    <dl class="specs">
      <div><dt>Ligplaats</dt><dd>${P.berth}</dd></div>
      <div><dt>Boot</dt><dd>${esc(P.vname)}</dd></div>
      <div><dt>Aankomst</dt><dd>${niceDate(P.arrive)}</dd></div>
      <div><dt>Vertrek</dt><dd>${nights()===0?'Dezelfde dag, uiterlijk 20:00':niceDate(P.depart)}</dd></div>
    </dl>
    ${berthPrice()}
  </div>
  <section class="card">
    <h3>Bij aankomst</h3>
    <ul class="facts">
      <li>${icons.radio}<span>Meld je via <b>marifoon kanaal 31</b> zodra je de haveningang nadert.</span></li>
      <li>${icons.pin}<span>Vaar naar <b>${P.berth}</b>. Is die plek toch bezet, dan wijst de havenmeester je een andere.</span></li>
      <li>${icons.coin}<span>Betaal bij het havenkantoor (08:00–20:00) of bij de betaalzuil op de steiger.</span></li>
    </ul>
  </section>`;
}

function renderBerthBar(){
  const t = berthTotal();
  const tot = `<div class="tot"><small>Bij aankomst</small><b id="bartot">${t===null?'—':eur(t)}</b></div>`;
  document.getElementById('bar').innerHTML = [
    `<button class="btn" data-act="pnext">Verder naar je boot</button>`,
    tot + `<button class="btn" data-act="pnext">Verder</button>`,
    tot + `<button class="btn" data-act="psubmit">Aanmelden</button>`,
    `<button class="btn ghost" data-act="preset">Nieuwe aanmelding</button>`,
  ][S.step];
}

function validateBerth(step){
  const E = {};
  if(step===0){
    const n = nights();
    if(n<0) E.dates = 'Kies een vertrekdatum op of na je aankomstdatum.';
    else if(n>BERTH.maxNights) E.dates = `Je kunt je voor maximaal ${BERTH.maxNights} nachten aanmelden. Blijf je langer, neem dan contact op met de havenmeester.`;
  }
  if(step===1){
    const L = num(P.vlength), B = num(P.vbeam), D = num(P.vdraft);
    if(!P.vname.trim()) E.vname = 'Vul de naam van je boot in.';
    if(!(L>0)) E.vlength = 'Vul de lengte in meters in.'; else if(L>BERTH.maxLen) E.vlength = 'Boten langer dan 15 m passen niet in de haven.';
    if(!(B>0)) E.vbeam = 'Vul de breedte in.'; else if(B>BERTH.maxBeam) E.vbeam = 'Maximaal 4,5 m breed.';
    if(!(D>0)) E.vdraft = 'Vul de diepgang in.'; else if(D>BERTH.maxDraft) E.vdraft = 'Maximaal 1,60 m diepgang.';
  }
  if(step===2){
    if(!P.pname.trim()) E.pname = 'Vul je naam in.';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(P.pemail.trim())) E.pemail = 'Vul een geldig e-mailadres in, bijvoorbeeld naam@voorbeeld.nl.';
    if(P.pphone.replace(/\D/g,'').length < 10) E.pphone = 'Vul een telefoonnummer van minstens 10 cijfers in.';
    if(!P.agree) E.pagree = 'Ga akkoord met het havenreglement om je aan te melden.';
  }
  return E;
}

function go(step){ S.step = step; S.errors = {}; render(); window.scrollTo({top:0}); }

function validate(){
  const E = {};
  if(!S.name.trim()) E.name = 'Vul je naam in.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim())) E.email = 'Vul een geldig e-mailadres in, bijvoorbeeld naam@voorbeeld.nl.';
  if(S.phone.replace(/\D/g,'').length < 10) E.phone = 'Vul een telefoonnummer van minstens 10 cijfers in.';
  if(boat().license && !S.license.trim()) E.license = 'Voor deze boot is een vaarbewijs verplicht.';
  if(!S.agree) E.agree = 'Ga akkoord met de huurvoorwaarden om te boeken.';
  return E;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act;
  if(a==='hours'){ S.hours=+t.dataset.h; const o=startOptions(); if(!o.includes(S.start)) S.start=o[o.length-1]; if(S.hours===8) S.start=10; render(); }
  else if(a==='ppl'){ S.people=Math.min(12,Math.max(1,S.people+ +t.dataset.d)); render(); }
  else if(a==='find') go(1);
  else if(a==='pick'){ S.boatId=t.dataset.id; go(2); }
  else if(a==='goto') go(+t.dataset.s);
  else if(a==='back') go(S.step-1);
  else if(a==='pay'){
    S.errors = validate();
    if(Object.keys(S.errors).length){ render(); const first=document.querySelector('.err'); first && first.scrollIntoView({block:'center'}); return; }
    S.code = 'WH-' + S.date.slice(5).replace('-','') + '-' + String(1000+Math.floor(Math.random()*9000));
    go(4);
  }
  else if(a==='mode'){ S.mode = t.dataset.m; go(0); }
  else if(a==='pppl'){ P.people = Math.min(12,Math.max(1,P.people+ +t.dataset.d)); render(); }
  else if(a==='pnext' || a==='psubmit'){
    S.errors = validateBerth(S.step);
    if(Object.keys(S.errors).length){ render(); const first=document.querySelector('.err'); first && first.scrollIntoView({block:'center'}); return; }
    if(a==='psubmit'){
      P.code = 'PA-' + P.arrive.slice(5).replace('-','') + '-' + String(1000+Math.floor(Math.random()*9000));
      P.berth = `Steiger ${num(P.vlength)<=10?'A':'B'}, box ${1 + hash(P.vname+P.arrive)%24}`;
    }
    go(S.step+1);
  }
  else if(a==='preset'){ Object.assign(P,{vname:'',vlength:'',vbeam:'',vdraft:'',pname:'',pemail:'',pphone:'',premark:'',agree:false,code:'',berth:''}); go(0); }
  else if(a==='reset'){ Object.assign(S,{boatId:null,extras:new Set(['dekens']),name:'',email:'',phone:'',license:'',remark:'',agree:false,code:''}); go(0); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='date'){ S.date = t.value || iso(tomorrow); }
  else if(t.id==='start'){ S.start = +t.value; render(); }
  else if(t.dataset.extra){ t.checked ? S.extras.add(t.dataset.extra) : S.extras.delete(t.dataset.extra); render(); }
  else if(t.id==='agree'){ S.agree = t.checked; }
  else if(t.id==='parrive'){
    P.arrive = t.value || iso(tomorrow);
    if(nights()<0){ const d = new Date(P.arrive+'T12:00'); d.setDate(d.getDate()+1); P.depart = iso(d); }
    render();
  }
  else if(t.id==='pdepart'){ P.depart = t.value || P.arrive; render(); }
  else if(t.id==='ppower'){ P.power = t.checked; }
  else if(t.id==='vtype'){ P.vtype = t.value; }
  else if(t.id==='pagree'){ P.agree = t.checked; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(['name','email','phone','license','remark'].includes(t.id)) S[t.id] = t.value;
  else if(P_FIELDS.includes(t.id)){ P[t.id] = t.value; if(t.id==='vlength') updateBerthPrice(); }
});

const MODES = {
  huur: {labels:STEP_LABELS, views:[viewSearch, viewList, viewDetail, viewForm, viewDone]},
  passant: {labels:['Verblijf','Je boot','Gegevens'], views:[viewBerth, viewVessel, viewBerthForm, viewBerthDone]},
};
render();
</script>
</body>
</html>
